<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Resume Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            background-image: linear-gradient(to bottom, #f0f0f0, #cccccc);
            overflow-x: hidden;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transform: translateY(50px);
            opacity: 0;
            animation: slideUpFadeIn 1.5s ease-out forwards;
        }
        h1 {
            color: #333;
            text-align: center;
            text-shadow: 2px 2px 5px #aaaaaa;
            font-size: 36px;
            font-weight: bold;
        }
        label {
            font-weight: bold;
            font-size: 18px;
            color: #666;
        }
        #generate-resume-btn, #download-resume-btn {
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.5s;
        }
        #generate-resume-btn {
            background-color: #4CAF50;
            color: #ffffff;
        }
        #generate-resume-btn:hover {
            background-color: #3e8e41;
        }
        #download-resume-btn {
            background-color: #007bff;
            color: #ffffff;
            margin-left: 10px;
        }
        #download-resume-btn:hover {
            background-color: #0069d9;
        }
        #resume-display {
            background-color: #f9f9f9;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        img.profile-pic {
            max-width: 150px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        @keyframes slideUpFadeIn {
            0% {
                transform: translateY(50px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Resume Generator</h1>
        <form id="resume-form">
            <div class="mb-3">
                <label for="profile-pic">Upload Profile Picture:</label>
                <input type="file" class="form-control" id="profile-pic" accept="image/*">
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label>Name:</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name">
                    <label>Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    <label>Phone:</label>
                    <input type="text" class="form-control" id="phone" placeholder="Enter your phone number">
                    <label>Address:</label>
                    <textarea class="form-control" id="address" rows="2" placeholder="Enter your address"></textarea>
                </div>
                <div class="col-md-6">
                    <label>Objective:</label>
                    <textarea class="form-control" id="objective" rows="3" placeholder="Enter your objective"></textarea>
                    <label>Skills:</label>
                    <input type="text" class="form-control" id="skills" placeholder="Enter your skills">
                    <label>Work Experience:</label>
                    <textarea class="form-control" id="work-experience" rows="3" placeholder="Enter your work experience"></textarea>
                    <label>Education:</label>
                    <textarea class="form-control" id="education" rows="3" placeholder="Enter your education"></textarea>
                </div>
            </div>
            <button type="button" class="btn" id="generate-resume-btn">Generate Resume</button>
            <button type="button" class="btn" id="download-resume-btn">Download Resume</button>
        </form>
        <div id="resume-display"></div>
    </div>

    <script>
        $(document).ready(function() {
            $('#generate-resume-btn').click(function() {
                var name = $('#name').val();
                var email = $('#email').val();
                var phone = $('#phone').val();
                var address = $('#address').val();
                var objective = $('#objective').val();
                var skills = $('#skills').val();
                var workExperience = $('#work-experience').val();
                var education = $('#education').val();
                var profilePic = $('#profile-pic')[0].files[0];

                if (name && email && phone && address && objective && skills && workExperience && education) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var imgTag = profilePic ? `<img src="${e.target.result}" class="profile-pic">` : '';
                        var resume = `
                            ${imgTag}
                            <h2>${name}</h2>
                            <p>Email: ${email}</p>
                            <p>Phone: ${phone}</p>
                            <p>Address: ${address}</p>
                            <h3>Objective:</h3>
                            <p>${objective}</p>
                            <h3>Skills:</h3>
                            <p>${skills}</p>
                            <h3>Work Experience:</h3>
                            <p>${workExperience}</p>
                            <h3>Education:</h3>
                            <p>${education}</p>
                        `;
                        $('#resume-display').html(resume);
                    };

                    if (profilePic) {
                        reader.readAsDataURL(profilePic);
                    } else {
                        reader.onload({ target: { result: '' } });
                    }
                } else {
                    alert('Please fill out all fields before generating a resume.');
                }
            });

            $('#download-resume-btn').click(function() {
                var resumeContent = document.getElementById('resume-display');
                var doc = new jsPDF();
                doc.html(resumeContent, {
                    callback: function (doc) {
                        doc.save('resume.pdf');
                    },
                    x: 10,
                    y: 10
                });
            });
        });
    </script>
</body>
</html>
